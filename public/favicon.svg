<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- One puffin facing right, drawn in a 100×130 box -->
    <g id="p">
      <!-- body: black back, white chest -->
      <ellipse cx="40" cy="106" rx="32" ry="31" fill="#141414"/>
      <ellipse cx="51" cy="114" rx="14" ry="20" fill="#F5F0E8"/>
      <!-- head -->
      <circle cx="44" cy="54" r="28" fill="#141414"/>
      <!-- white face -->
      <ellipse cx="54" cy="56" rx="16" ry="19" fill="#F5F0E8"/>
      <!-- beak: grey base, orange tip, yellow ridge -->
      <path d="M64 40 C80 42 92 50 92 56 C92 62 80 68 64 70 Z" fill="#F26B2A"/>
      <path d="M64 40 C67 40.4 69.5 40.9 71.5 41.6 L71.5 68.4 C69.5 69.1 67 69.6 64 70 Z" fill="#4A5560"/>
      <path d="M75.5 44.5 C77 51 77 61 75.5 67.5" stroke="#FFC24A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <line x1="64" y1="55" x2="91" y2="56" stroke="#B8461C" stroke-width="1.2" stroke-linecap="round"/>
      <!-- eye with red ring and grey mark -->
      <path d="M52 44 L60.5 42 L57 46.5 Z" fill="#8A9099"/>
      <circle cx="57.5" cy="50.5" r="4.8" fill="none" stroke="#E0452B" stroke-width="1.7"/>
      <circle cx="57.5" cy="50.5" r="2.7" fill="#141414"/>
      <circle cx="58.4" cy="49.6" r="0.9" fill="#F5F0E8"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="#1A1916"/>
  <circle cx="256" cy="276" r="206" fill="#EADFCB"/>

  <!-- the pair, beaks almost touching in the middle -->
  <use href="#p" transform="translate(28 150) scale(2.4)"/>
  <use href="#p" transform="translate(484 150) scale(-2.4 2.4)"/>

  <!-- heart -->
  <path d="M256 164 C256 146 230 138 226 160 C222 180 256 198 256 198 C256 198 290 180 286 160 C282 138 256 146 256 164 Z" fill="#FF6B35"/>
</svg>
